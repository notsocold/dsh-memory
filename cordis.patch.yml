# dsh-memory bundle patch: mount the Host half in the profile.
#
# The row id is stable so a profile or home patch can override config later.
# The plugin is self-contained: it imports no Harness package, reads its
# settings from $DSH_HOME/dsh-memory/memory.json, and registers its Web half
# through package.json `dsh.client`.
- insert:
    - id: dsh-memory
      name: '@local/dsh-memory'
